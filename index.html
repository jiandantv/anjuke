<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书房源合规生成器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif;}
        body{background:#f5f5f7;padding:30px 15px;max-width:680px;margin:0 auto;}
        h1{text-align:center;color:#222;margin-bottom:40px;font-size:24px;}
        .card{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 12px #00000010;}
        .card h3{margin-bottom:16px;color:#333;font-size:18px;}
        .input-box{width:100%;padding:14px 16px;border:1px solid #ddd;border-radius:10px;font-size:15px;margin-bottom:16px;}
        .btn{width:100%;padding:14px;border:none;border-radius:10px;background:#ff2442;color:#fff;font-size:16px;cursor:pointer;}
        .btn:disabled{background:#ff8899;cursor:not-allowed;}
        #result{margin-top:30px;}
        .res-block{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;}
        .res-title{font-weight:bold;margin-bottom:10px;color:#222;}
        .text-content{white-space:pre-wrap;line-height:1.8;color:#444;}
        .img-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;}
        .img-list img{width:100%;border-radius:8px;object-fit:cover;}
        .cover-img{margin-top:15px;text-align:center;}
        .cover-img img{width:100%;max-width:320px;border-radius:12px;box-shadow:0 4px 15px #00000020;}
        .loading{color:#ff2442;text-align:center;padding:20px;font-size:16px;}
        .tip{color:#999;font-size:12px;margin-top:10px;text-align:center;}
    </style>
</head>
<body>

<h1>小红书房源合规生成器</h1>

<div class="card">
    <h3>🏠 58安居客房源链接</h3>
    <input class="input-box" id="anjukeUrl" placeholder="粘贴58安居客二手房链接">
    <button class="btn" id="btnAnjuke" onclick="runAnjuke()">一键生成小红书图文</button>
</div>

<div class="card">
    <h3>🏡 巧房房源链接（微信短链/分享链）</h3>
    <input class="input-box" id="qiaofangUrl" placeholder="粘贴巧房链接 / wxaurl微信短链">
    <button class="btn" id="btnQiaofang" onclick="runAnjuke()">一键生成小红书图文</button>
</div>

<div id="result"></div>

<script>
// 后端接口已内置，无需你修改
const API_HOST = "https://api-house.xiaohongshu-tool.com";

function disableBtn(id){
    document.getElementById(id).disabled = true;
    document.getElementById(id).innerText = "生成中，请稍等...";
}
function enableBtn(id,txt){
    document.getElementById(id).disabled = false;
    document.getElementById(id).innerText = txt;
}

async function runAnjuke(){
    let anjukeUrl = document.getElementById("anjukeUrl").value.trim();
    let qiaofangUrl = document.getElementById("qiaofangUrl").value.trim();
    let url = anjukeUrl || qiaofangUrl;

    if(!url){
        alert("请粘贴任意一个平台房源链接");
        return;
    }

    let btnId = anjukeUrl ? "btnAnjuke" : "btnQiaofang";
    disableBtn(btnId);
    document.getElementById("result").innerHTML = '<div class="loading">正在抓取房源信息👉 AI生成火兔同款合规文案👉 自动制作小红书封面...</div>';

    try{
        let res = await fetch(`${API_HOST}/api/house`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({url:url})
        })
        let data = await res.json();
        showResult(data);
    }catch(e){
        document.getElementById("result").innerHTML = '<div class="loading">生成失败，请检查链接稍后重试</div>';
    }
    enableBtn(btnId,"一键生成小红书图文");
}

function showResult(data){
    let html = `
    <div class="res-block">
        <div class="res-title">📝 AI文案（火兔同款+小红书合规）</div>
        <div class="text-content">${data.article}</div>
    </div>
    <div class="res-block">
        <div class="res-title">🎬 小红书合规封面（1080×1350）</div>
        <div class="cover-img"><img src="${data.cover}" alt="小红书封面"></div>
        <div class="tip">可长按保存直接发小红书</div>
    </div>
    <div class="res-block">
        <div class="res-title">🏘️ 房源实拍原图</div>
        <div class="img-list">
            ${data.images.map(item=>`<img src="${item}">`).join("")}
        </div>
    </div>
    <div class="tip">⚠️ 文案已规避小红书房产违规词，可直接发布</div>
    `;
    document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
